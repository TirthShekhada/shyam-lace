    <script>
      var pageAction = "homeshow";
      window.dataLayer = window.dataLayer || [];
      window.gtmEnabled = true;
      window.sendCustomersGeolocationDataToGTM = true;
      var orderId = -1;
      var dataLayerEvent = { event: "home", currentPageView: "HomePageView" };

      // In all cases except Order Confirmation, the data layer should be pushed, so default to that case
      var pushDataLayer = true;
      if (pageAction === "orderconfirm") {
        // As of now, the correction is for order confirmation only
        if (dataLayerEvent) {
          orderId = getOrderId(dataLayerEvent);
        }

        var ordersPushedToGoogle = getOrdersPushedToGoogle();
        var orderHasBeenPushedToGoogle = orderHasBeenPushedToGoogle(
          orderId,
          ordersPushedToGoogle,
        );
        if (orderHasBeenPushedToGoogle) {
          // If the data has already been sent, let's not push it again.
          pushDataLayer = false;
        }
      }

      if (pushDataLayer) {
        if (dataLayerEvent) {
          dataLayer.push(dataLayerEvent);
        }

        if (pageAction === "orderconfirm") {
          // Add the orderId to the array of orders that is being stored in localStorage
          ordersPushedToGoogle.push(orderId);
          // The localStorage is what is used to prevent the duplicate send from mobile platforms
          window.localStorage.setItem(
            "ordersPushedToGoogle",
            JSON.stringify(ordersPushedToGoogle),
          );
        }
      }

      function getOrderId(dataLayer) {
        if ("ecommerce" in dataLayer) {
          if (
            "purchase" in dataLayer.ecommerce &&
            "actionField" in dataLayer.ecommerce.purchase &&
            "id" in dataLayer.ecommerce.purchase.actionField
          ) {
            return dataLayer.ecommerce.purchase.actionField.id;
          }
        }

        return -1;
      }

      function getGA4OrderId(dataLayer) {
        if (
          "ecommerce" in dataLayer &&
          "transaction_id" in dataLayer.ecommerce
        ) {
          return dataLayer.ecommerce.transaction_id;
        }

        return -1;
      }

      function getOrdersPushedToGoogle() {
        var ordersPushedToGoogleString = window.localStorage.getItem(
          "ordersPushedToGoogle",
        );
        if (
          ordersPushedToGoogleString &&
          ordersPushedToGoogleString.length > 0
        ) {
          return JSON.parse(ordersPushedToGoogleString);
        }

        return [];
      }

      function orderHasBeenPushedToGoogle(orderId, ordersPushedToGoogle) {
        if (orderId) {
          for (var index = 0; index < ordersPushedToGoogle.length; index++) {
            if (ordersPushedToGoogle[index] === orderId) {
              return true;
            }
          }
        }

        return false;
      }
    </script>
    <script>
      if (window.gtmEnabled && window.sendCustomersGeolocationDataToGTM) {
        sendCustomerGeolocationDataToGTM();

      // Function to send the Customer Geolocation Data to GTM. This Function is added here because of below reason
      // 1. the "pdict" scope variable is Not Accessible in JS.
      // 2. We cannot send these values in URL Params or Window variable or any storage. As this will expose the location data in JS.
      function sendCustomerGeolocationDataToGTM() {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              var customersGeolocationDataForGTM = [
                {
                  city1: "Surat",
                  state1: "Gujarat",
                  country1: "IN",
                  zipCode1: "394101",
                },
              ];
              dataLayer.push(customersGeolocationDataForGTM);
            },
            (error) => {
              switch (error.code) {
                case error.PERMISSION_DENIED:
                case error.POSITION_UNAVAILABLE:
                case error.TIMEOUT:
                  break;
                default:
              }
            },
          );
        }
      }

      window.dataLayer = window.dataLayer || [];
      const queryString = window.location.search;

      };
      if (query) {

        customerdata.siteSection = "Search-Show";
      }
